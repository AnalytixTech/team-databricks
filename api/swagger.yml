                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated

  /reservations/soft:
    post:
      tags:
        - Reservations
      summary: Create soft reservation (guest users)
      description: |
        Guest users can create a soft reservation without an account.
        Soft reservations:
        - Expire after 24 hours if not converted
        - Can be overridden by firm reservations
        - Require driver's license information
        - Require guest contact information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - carId
                - startDate
                - endDate
                - guestInfo
                - driverLicense
              properties:
                carId:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                startTime:
                  type: string
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                  example: '10:00'
                endTime:
                  type: string
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                  example: '18:00'
                guestInfo:
                  type: object
                  required: [email, phone]
                  properties:
                    email:
                      type: string
                      format: email
                    phone:
                      type: string
                driverLicense:
                  type: object
                  required: [number, expiryDate]
                  properties:
                    number:
                      type: string
                    expiryDate:
                      type: string
                      format: date
      responses:
        '201':
          description: Soft reservation created successfully
        '400':
          description: Invalid data or car not available
        '409':
          description: Dates conflict with existing firm reservation

  /reservations/firm:
    post:
      tags:
        - Reservations
      summary: Create firm reservation (authenticated users)
      description: |
        Authenticated users create firm reservations that:
        - Override soft reservations
        - Require user to have driver's license in profile
        - Cannot overlap with other firm reservations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - carId
                - startDate
                - endDate
              properties:
                carId:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                startTime:
                  type: string
                  example: '10:00'
                endTime:
                  type: string
                  example: '18:00'
      responses:
        '201':
          description: Firm reservation created successfully
        '400':
          description: Missing driver's license or invalid dates
        '409':
          description: Car already reserved for selected dates

  /reservations/my:
    get:
      tags:
        - Reservations
      summary: Get user's reservations
      description: Returns all reservations for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user reservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'

